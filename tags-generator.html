<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free YouTube Tags Generator Tool - Optimize your videos with powerful tags.">
  <meta name="author" content="Vivek Balasaheb Kedari">
  <title>YouTube Tags Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-4653586285489354~7933978688" crossorigin="anonymous"></script>
  <style>
    body {
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .tag {
      background-color: #6366f1;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      margin: 0.25rem;
      display: inline-block;
      font-size: 0.875rem;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="bg-indigo-600 text-white p-4 text-center text-2xl font-bold shadow-md">
    YouTube Tags Generator 🎯
  </header>

  <main class="flex-grow p-6 flex flex-col items-center">
    <!-- Top Ad Section -->
    <div class="my-4">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-4653586285489354"
           data-ad-slot="9216577677"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <h2 class="text-2xl font-semibold text-indigo-700 mb-4">Paste your video title or keywords</h2>
    <textarea id="input" rows="4" class="w-full max-w-xl p-4 border rounded-lg shadow-sm mb-4" placeholder="Enter video title or keywords..."></textarea>
    <button onclick="generateTags()" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-full font-semibold shadow-md mb-6">Generate Tags</button>

    <div id="output" class="max-w-2xl w-full flex flex-wrap justify-center"></div>

    <!-- Bottom Ad Section -->
    <div class="mt-10">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-4653586285489354"
           data-ad-slot="3964250998"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </main>

  <footer class="bg-indigo-700 text-white text-center p-4">
    &copy; 2025 Vivek Balasaheb Kedari. All rights reserved.
  </footer>

  <script>
    function generateTags() {
      const input = document.getElementById('input').value.trim();
      const output = document.getElementById('output');
      output.innerHTML = '';
      if (input.length === 0) return;

      const keywords = input.toLowerCase().split(/[ ,]+/).filter(Boolean);
      const uniqueTags = [...new Set(keywords.map(word => `#${word}`))];

      uniqueTags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        output.appendChild(span);
      });
    }
  </script>
</body>
</html>
