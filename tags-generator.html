<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate YouTube tags easily and optimize your videos with the best SEO practices. A tool created by Vivek Balasaheb Kedari.">
  <meta name="author" content="Vivek Balasaheb Kedari">
  <meta name="keywords" content="YouTube, tags generator, SEO, video optimization, YouTube tags, content creator">
  <meta name="robots" content="index, follow">
  <title>YouTube Tags Generator Tool | Created by Vivek Balasaheb Kedari</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-4653586285489354~7933978688" crossorigin="anonymous"></script>
  <style>
    body {
      background: linear-gradient(to right, #d6a4a4, #d9d9d9);
    }
    .tag {
      background-color: #4c51bf;
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      margin: 0.3rem;
      display: inline-block;
      font-size: 0.875rem;
    }
    .copy-button {
      background-color: #10b981;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 1rem;
    }
    .copy-button:hover {
      background-color: #065f46;
    }
    .header {
      background: #5A67D8;
      color: white;
      padding: 1.5rem 0;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      border-radius: 10px 10px 0 0;
    }
    .footer {
      background: #2d3748;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .output-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }
    .ads-container {
      margin: 1.5rem 0;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <h1>YouTube Tags Generator Tool</h1>
    <p>By Vivek Balasaheb Kedari</p>
  </header>

  <!-- Main Section -->
  <main class="p-6">
    <!-- Google AdSense (Top Ad) -->
    <div class="ads-container">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-4653586285489354"
           data-ad-slot="9216577677"
           data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="container mx-auto text-center">
      <h2 class="text-xl text-gray-700 mb-4">Enter Your Video Title or Keywords</h2>
      <textarea id="inputText" class="w-full max-w-xl p-4 border border-gray-300 rounded-lg shadow-lg" rows="4" placeholder="Type your video title or keywords..."></textarea>
      <br>
      <button id="generateBtn" onclick="generateTags()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full font-semibold shadow-lg mt-4">
        Generate Tags
      </button>
    </div>

    <div id="tagsOutput" class="output-container mt-6"></div>

    <!-- Copy Button -->
    <button id="copyBtn" class="copy-button" style="display:none;" onclick="copyTags()">Copy Tags</button>

    <!-- Google AdSense (Bottom Ad) -->
    <div class="ads-container mt-6">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-app-pub-4653586285489354"
           data-ad-slot="3964250998"
           data-ad-format="auto"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="footer">
    <p>&copy; 2025 Vivek Balasaheb Kedari. All rights reserved.</p>
  </footer>

  <script>
    // Function to generate tags
    function generateTags() {
      const inputText = document.getElementById('inputText').value.trim();
      const tagsOutput = document.getElementById('tagsOutput');
      const copyBtn = document.getElementById('copyBtn');
      tagsOutput.innerHTML = '';
      copyBtn.style.display = 'none';

      if (!inputText) return;

      let tags = [];
      // Example logic for generating tags from the input text
      const relatedTags = {
        "tech": ["technology", "gadgets", "electronics", "innovation", "devices"],
        "movie": ["film", "cinema", "blockbuster", "action", "drama", "comedy"],
        "fitness": ["workout", "exercise", "health", "gym", "yoga"],
        "food": ["recipe", "cooking", "meal", "restaurant", "tasty"]
      };

      // Check for matching keywords and add related tags
      for (let key in relatedTags) {
        if (inputText.toLowerCase().includes(key)) {
          tags = [...tags, ...relatedTags[key]];
        }
      }

      // Add the video title or keywords as tags
      tags.push(inputText);
      tags = [...new Set(tags)].map(tag => tag.substring(0, 30));

      // Display tags in the output section
      tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = '#' + tag;
        tagsOutput.appendChild(span);
      });

      // Show the copy button
      copyBtn.style.display = 'inline-block';
      copyBtn.dataset.tags = tags.join(", ");
    }

    // Function to copy tags to clipboard
    function copyTags() {
      const copyText = document.getElementById("copyBtn").dataset.tags;
      navigator.clipboard.writeText(copyText).then(function() {
        alert("Tags copied to clipboard!");
      }, function(err) {
        alert("Error copying tags: ", err);
      });
    }
  </script>

</body>
</html>
