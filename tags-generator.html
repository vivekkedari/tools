<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="author" content="Vivek Balasaheb Kedari" />
  <meta name="description" content="Generate high-quality YouTube tags with our free SEO tool!" />
  <meta name="keywords" content="YouTube tags generator, SEO tool, video tags, Vivek Kedari, YouTube SEO"/>
  <title>YouTube Tags Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #3f51b5;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      padding: 12px 24px;
      background: #3f51b5;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #303f9f;
    }
    #tags {
      margin-top: 20px;
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 1rem;
    }
    .copy-btn {
      background: #009688;
      margin-left: 10px;
    }
    .ads {
      margin: 30px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Tags Generator</h1>
    <input type="text" id="title" placeholder="Enter your YouTube video title..." />
    <button onclick="generateTags()">Generate Tags</button>
    <button class="copy-btn" onclick="copyTags()">Copy Tags</button>

    <div id="tags"></div>

    <div class="ads">
      <!-- Top AdMob Ad -->
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
      <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-app-pub-4653586285489354~7933978688"
        data-ad-slot="9216577677"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="ads">
      <!-- Bottom AdMob Ad -->
      <ins class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-app-pub-4653586285489354~7933978688"
        data-ad-slot="3964250998"
        data-ad-format="auto"
        data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <script>
    function generateTags() {
      const input = document.getElementById('title').value.trim().toLowerCase();
      const keywords = input.split(" ").filter(w => w.length > 2);
      const baseTags = ["youtube", "video", "viral", "trending", "shorts", "how to", "tutorial"];
      const allTags = new Set([...keywords, ...keywords.map(w => w + " video"), ...baseTags]);
      document.getElementById("tags").textContent = Array.from(allTags).join(", ");
    }

    function copyTags() {
      const text = document.getElementById("tags").textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Tags copied to clipboard!");
      });
    }
  </script>
</body>
</html>
