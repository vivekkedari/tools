<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate SEO-friendly YouTube video tags with ease using this responsive tool. Developed by Vivek Balasaheb Kedari." />
  <meta name="author" content="Vivek Balasaheb Kedari" />
  <title>YouTube Tags Generator Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .tag { background-color: #c7d2fe; padding: 0.5rem 1rem; border-radius: 9999px; margin: 0.25rem; display: inline-block; font-weight: 500; color: #1e3a8a; }
    .gradient-bg {
      background: linear-gradient(to right, #3b82f6, #9333ea);
    }
    .input-box {
      background: #fdf4ff;
      border: 2px solid #c084fc;
    }
    .btn-custom {
      background: linear-gradient(to right, #6366f1, #ec4899);
    }
    .btn-custom:hover {
      background: linear-gradient(to right, #4338ca, #db2777);
    }
  </style>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-4653586285489354~7933978688" crossorigin="anonymous"></script>
</head>
<body class="bg-gradient-to-b from-purple-50 to-indigo-100 text-gray-800 min-h-screen">
  <header class="text-center p-6 gradient-bg text-white shadow-md">
    <h1 class="text-4xl font-extrabold">🎯 YouTube Tags Generator</h1>
    <p class="mt-2 text-lg font-medium">By Vivek Balasaheb Kedari</p>
  </header>

  <!-- Top Ad Section -->
  <div class="my-4 flex justify-center">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-app-pub-4653586285489354"
         data-ad-slot="9216577677"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <main class="max-w-3xl mx-auto px-4 py-6 bg-white rounded-xl shadow-xl">
    <div class="mb-6">
      <label for="keyword" class="block text-lg font-semibold mb-2 text-purple-700">🎬 Enter Your Video Topic or Title:</label>
      <input type="text" id="keyword" class="w-full p-3 rounded-lg input-box shadow-md" placeholder="e.g., Best SEO Tips for YouTube 2025" />
      <button onclick="generateTags()" class="mt-4 btn-custom text-white font-bold py-2 px-6 rounded-lg shadow-md">✨ Generate Tags</button>
    </div>

    <div>
      <h2 class="text-2xl font-bold text-pink-600 mb-4">📌 Generated Tags:</h2>
      <div id="tagOutput" class="flex flex-wrap"></div>
    </div>
  </main>

  <!-- Bottom Ad Section -->
  <div class="my-6 flex justify-center">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-app-pub-4653586285489354"
         data-ad-slot="3964250998"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <footer class="text-center text-sm text-gray-500 py-4">
    &copy; 2025 Vivek Balasaheb Kedari. All rights reserved.
  </footer>

  <script>
    function generateTags() {
      const keyword = document.getElementById('keyword').value.trim();
      const output = document.getElementById('tagOutput');
      output.innerHTML = '';
      if (keyword === '') return;

      const words = keyword.toLowerCase().split(/\s+/);
      const baseTags = [keyword, ...words.map(w => `#${w}`), ...words.map(w => `${w} tutorial`), `${keyword} tips`, `${keyword} 2025`, `${keyword} hindi`, `${keyword} guide`];

      const uniqueTags = [...new Set(baseTags)].slice(0, 25);

      uniqueTags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        output.appendChild(span);
      });
    }
  </script>
</body>
</html>
